[build-system]
requires = ["setuptools"]
build-backend = 'setuptools.build_meta'

[tool.setuptools.package-dir]
"" = "py"

[project]
name = "adaptic"
authors = [
    {name = "AI Universe Collaboration"}
]
description = "Adapting cosmology datasets for AI"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "fitsio",
    "torch"
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "adaptic.__version__"}
